<!DOCTYPE html>
<html lang="ko" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moonlight - 논문 라이브러리</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              500: '#5850ec',
              600: '#4f46e5'
            }
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <style>
    body {
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
  </style>
</head>
<body class="h-full bg-[#fcfcfc] dark:bg-[#0c0c0e] text-zinc-900 dark:text-zinc-100 flex overflow-hidden select-none">
  <!-- Hidden File Input for PDF Upload -->
  <input type="file" id="lib-pdf-upload" accept="application/pdf" class="hidden" onchange="libApp.handleUpload(event)" />

  <!-- LEFT SIDEBAR -->
  <aside id="lib-sidebar" class="w-60 border-r border-zinc-200/90 dark:border-zinc-800 bg-[#fbfbfb] dark:bg-[#101014] flex flex-col justify-between p-4 shrink-0 transition-all">
    <div class="space-y-6">
      <!-- Logo -->
      <div class="flex items-center justify-between">
        <a href="index.html" class="flex items-center gap-2.5 cursor-pointer text-inherit no-underline">
          <div id="library-brand-logo" class="w-7 h-7 rounded-full bg-gradient-to-tr from-purple-900 via-indigo-700 to-pink-500 shadow-sm flex items-center justify-center transition">
            <div class="w-2.5 h-2.5 rounded-full bg-white/90"></div>
          </div>
          <span id="library-brand-title" class="text-base font-bold tracking-tight">Research Studio</span>
        </a>
        <button onclick="libApp.toggleSidebar()" class="p-1.5 rounded-lg text-zinc-400 hover:text-zinc-700 dark:hover:text-zinc-200 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition" title="사이드바 접기/펼치기">
          <svg class="w-4 h-4 fill-none stroke-current stroke-2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
        </button>
      </div>

      <!-- Navigation Links -->
      <nav class="space-y-1">
        <!-- 1. 최근 열어본 논문 -->
        <button id="nav-recent" onclick="libApp.setTab('recent')"
                class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-semibold bg-zinc-200/80 dark:bg-zinc-800 text-zinc-900 dark:text-white transition">
          <svg class="w-3.5 h-3.5 text-zinc-600 dark:text-zinc-300 stroke-current fill-none stroke-2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          <span>최근 열어본 논문</span>
        </button>

        <!-- 2. 라이브러리 검색 -->
        <button id="nav-search" onclick="libApp.setTab('search')"
                class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-medium text-zinc-600 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-800/60 transition">
          <svg class="w-3.5 h-3.5 text-zinc-400 stroke-current fill-none stroke-2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <span>라이브러리 검색</span>
        </button>

        <!-- 3. 라이브러리 & 폴더 -->
        <div>
          <div id="nav-library" onclick="libApp.setTab('library')"
               class="w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-medium text-zinc-600 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-800/60 cursor-pointer transition">
            <div class="flex items-center gap-2.5">
              <svg class="w-3.5 h-3.5 text-zinc-400 stroke-current fill-none stroke-2" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
              <span>라이브러리</span>
            </div>
            <button onclick="event.stopPropagation(); libApp.promptCreateFolder();"
                    class="w-5 h-5 rounded hover:bg-zinc-200 dark:hover:bg-zinc-700 flex items-center justify-center text-zinc-400 hover:text-zinc-800 dark:hover:text-white transition" title="새 폴더 생성">
              +
            </button>
          </div>
          <!-- Folders Subtree -->
          <div id="sidebar-folder-tree" class="pl-6 pr-2 py-1 space-y-0.5 text-xs text-zinc-500 dark:text-zinc-400">
          </div>
        </div>
      </nav>
    </div>

    <!-- Bottom Sidebar -->
    <div class="space-y-3 pt-4 border-t border-zinc-200/80 dark:border-zinc-800">
      <button onclick="libApp.setTab('trash')" class="w-full flex items-center gap-2.5 px-3 py-1.5 rounded-lg text-xs text-zinc-500 dark:text-zinc-400 hover:text-zinc-800 dark:hover:text-zinc-200 hover:bg-zinc-100 dark:hover:bg-zinc-800/50 transition">
        <svg class="w-3.5 h-3.5 stroke-current fill-none stroke-2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        <span>휴지통</span>
      </button>

      <div class="flex items-center justify-end pt-1">
        <!-- Profile Avatar Badge: Nickname (1) -->
        <div id="library-user-avatar" class="relative w-7 h-7 rounded-full bg-teal-500 text-white text-[10.5px] font-bold flex items-center justify-center cursor-pointer shadow-xs hover:opacity-90 transition border-0" title="내 프로필">
          <span id="library-user-avatar-text">Guest</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- MAIN VIEW -->
  <main class="flex-1 flex flex-col h-full overflow-hidden bg-white dark:bg-[#121217] relative">
    <!-- Top Action Toolbar -->
    <div class="px-8 py-5 flex items-center justify-between border-b border-zinc-100 dark:border-zinc-800/80">
      <div class="flex items-center gap-2">
        <h2 id="main-view-title" class="text-[17px] font-bold text-zinc-900 dark:text-white">최근 열어본 논문</h2>
        <button class="text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-300" title="논문 목록">
          <svg class="w-4 h-4 stroke-current fill-none stroke-2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
        </button>
      </div>

      <div class="flex items-center gap-3">
        <!-- List / Grid Toggle -->
        <div class="flex items-center bg-zinc-100 dark:bg-zinc-800 rounded-lg p-0.5 text-zinc-500">
          <button id="view-mode-list-btn" onclick="libApp.setLayout('list')" class="p-1 rounded-md bg-white dark:bg-zinc-700 text-zinc-900 dark:text-white shadow-xs">
            <svg class="w-3.5 h-3.5 stroke-current fill-none stroke-2" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
          </button>
          <button id="view-mode-grid-btn" onclick="libApp.setLayout('grid')" class="p-1 rounded-md text-zinc-400 hover:text-zinc-700 dark:hover:text-zinc-200">
            <svg class="w-3.5 h-3.5 stroke-current fill-none stroke-2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          </button>
        </div>

        <!-- Search Input -->
        <div class="relative">
          <input id="main-search-input" type="text" placeholder="논문 검색..." oninput="libApp.onSearch(this.value)"
                 class="pl-7 pr-3 py-1 rounded-lg border border-zinc-200 dark:border-zinc-700 text-xs bg-zinc-50 dark:bg-zinc-800/50 w-36 focus:w-56 focus:outline-none focus:border-indigo-500 transition-all text-zinc-900 dark:text-zinc-100" />
          <svg class="w-3.5 h-3.5 text-zinc-400 absolute left-2 top-1/2 -translate-y-1/2 stroke-current fill-none stroke-2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </div>

        <!-- Sort -->
        <button onclick="libApp.toggleSort()" class="p-1.5 rounded-lg text-zinc-500 hover:text-zinc-800 dark:hover:text-zinc-200 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition" title="정렬 기준 변경">
          <svg class="w-4 h-4 stroke-current fill-none stroke-2" viewBox="0 0 24 24"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
        </button>

        <!-- 논문 업로드 Button (Image 3) -->
        <button onclick="document.getElementById('lib-pdf-upload').click()"
                class="px-4 py-1.5 rounded-full bg-zinc-900 dark:bg-zinc-100 text-white dark:text-zinc-900 text-xs font-semibold flex items-center gap-1.5 hover:opacity-90 shadow-sm transition">
          <svg class="w-3.5 h-3.5 stroke-current fill-none stroke-2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
          <span>논문 업로드</span>
          <svg class="w-3 h-3 stroke-current fill-none stroke-2" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </button>

        <!-- 리더기로 돌아가기 -->
        <a href="index.html" class="p-1.5 rounded-lg text-zinc-400 hover:text-zinc-700 dark:hover:text-zinc-200 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition text-inherit no-underline" title="리더기로 이동">
          <svg class="w-5 h-5 stroke-current fill-none stroke-2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </a>
      </div>
    </div>

    <!-- Table Container -->
    <div id="table-scroll-container" class="flex-1 overflow-y-auto px-8 py-4">
      <table class="w-full text-left text-xs border-collapse">
        <thead>
          <tr class="border-b border-zinc-200 dark:border-zinc-800 text-zinc-400 dark:text-zinc-500 font-medium select-none">
            <th class="py-2.5 px-3 w-8">
              <input type="checkbox" id="check-all" onchange="libApp.toggleCheckAll(this.checked)" class="rounded border-zinc-300 text-indigo-600 focus:ring-0 cursor-pointer" />
            </th>
            <th class="py-2.5 px-3 min-w-[320px]">제목</th>
            <th class="py-2.5 px-3 w-32 cursor-pointer hover:text-zinc-700 dark:hover:text-zinc-300" onclick="libApp.sortBy('rating')">레이팅 ≡</th>
            <th class="py-2.5 px-3 w-28">노트</th>
            <th class="py-2.5 px-3 w-32 cursor-pointer hover:text-zinc-700 dark:hover:text-zinc-300" onclick="libApp.sortBy('tag')">태그 ▽</th>
            <th class="py-2.5 px-3 w-32 text-right">마지막 접근</th>
          </tr>
        </thead>
        <tbody id="library-table-rows" class="divide-y divide-zinc-100 dark:divide-zinc-800/60">
        </tbody>
      </table>
    </div>

    <!-- Bottom Pagination & Floating Graphic -->
    <div class="px-8 py-3.5 border-t border-zinc-100 dark:border-zinc-800/80 flex items-center justify-between text-xs text-zinc-400">
      <div id="item-count-label">0개의 논문</div>
      <div class="flex items-center gap-3">
        <button class="p-1 rounded hover:bg-zinc-100 dark:hover:bg-zinc-800 transition disabled:opacity-30" disabled>&lt;</button>
        <span class="text-zinc-800 dark:text-zinc-200 font-medium">1</span>
        <button class="p-1 rounded hover:bg-zinc-100 dark:hover:bg-zinc-800 transition disabled:opacity-30" disabled>&gt;</button>
      </div>
      <div></div>
    </div>

    <!-- Floating Graphic Circle (Bottom Right) -->
    <div id="library-floating-nebula" class="absolute bottom-6 right-8 w-20 h-20 rounded-full bg-gradient-to-tr from-purple-800 via-indigo-700 to-pink-500 opacity-90 shadow-2xl pointer-events-none flex items-center justify-center filter blur-xs transition">
      <div id="library-floating-nebula-inner" class="w-14 h-14 rounded-full bg-gradient-to-tr from-purple-950 to-indigo-900 border border-white/20 transition"></div>
    </div>
  </main>

  <script src="storage-db.js"></script>
  <script src="papers-data.js"></script>
  <script>
    class MoonlightLibraryApp {
      constructor() {
        this.activeTab = "recent";
        this.layoutMode = "list";
        this.sortMode = "recent";
        this.searchQuery = "";
        this.folders = [];
        this.ratings = {};
        this.papers = [];
        this.init();
      }

      async init() {
        // Dark mode setup
        const s = window.researchDB ? window.researchDB.getAppSettings() : {};
        if (s.lightMode === false || (!('lightMode' in s) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }

        // Load folders & ratings
        try {
          this.folders = JSON.parse(localStorage.getItem("moonlight_library_folders") || "[]");
        } catch (_) {
          this.folders = [];
        }
        try {
          this.ratings = JSON.parse(localStorage.getItem("moonlight_paper_ratings") || "{}");
        } catch (_) {
          this.ratings = {};
        }

        this.applyBrand();
        await this.loadPapers();
        this.renderFolders();
        this.renderTable();
      }

      async loadPapers() {
        let stored = [];
        if (window.researchDB) {
          try {
            stored = await window.researchDB.getAllUploadedPdfs();
          } catch (_) {
            stored = [];
          }
        }
        const samplePapers = window.MOONLIGHT_PAPERS || [];
        const map = new Map();
        samplePapers.forEach(p => map.set(p.id, p));
        stored.forEach(p => map.set(p.id, p));
        this.papers = Array.from(map.values());
      }

            applyBrand() {
        if (!window.researchDB) return;
        const cfg = window.researchDB.getBrandConfig();
        const titleEl = document.getElementById("library-brand-title");
        if (titleEl) titleEl.textContent = cfg.appName || "Research Studio";
        document.title = `${cfg.appName || "Research Studio"} - 논문 라이브러리`;

        const rawUser = (cfg.userName || "Guest").trim();
        const avatarEl = document.getElementById("library-user-avatar-text");
        let avatarText = rawUser;
        if (rawUser.length > 4) {
          if (/^[가-힣]+$/.test(rawUser)) {
            avatarText = rawUser.slice(-2);
          } else {
            const parts = rawUser.split(/\s+/);
            avatarText = parts.length >= 2 ? (parts[0][0] + parts[1][0]).toUpperCase() : (rawUser === 'Guest' ? 'Guest' : rawUser.slice(0, 2).toUpperCase());
          }
        }
        if (avatarEl) avatarEl.textContent = avatarText;
        const avatarBtn = document.getElementById("library-user-avatar");
        if (avatarBtn) avatarBtn.title = `내 프로필 (${rawUser})`;

        // Apply theme preset
        const themeMap = {
          indigo: {
            fullGrad: "from-purple-900 via-indigo-700 to-pink-500",
            nebulaOuter: "from-purple-800 via-indigo-700 to-pink-500",
            nebulaInner: "from-purple-950 to-indigo-900",
            avatarBg: "#0d9488"
          },
          emerald: {
            fullGrad: "from-teal-900 via-emerald-700 to-cyan-500",
            nebulaOuter: "from-teal-800 via-emerald-700 to-cyan-500",
            nebulaInner: "from-teal-950 to-emerald-900",
            avatarBg: "#059669"
          },
          sky: {
            fullGrad: "from-blue-900 via-sky-700 to-indigo-500",
            nebulaOuter: "from-blue-800 via-sky-700 to-indigo-500",
            nebulaInner: "from-blue-950 to-sky-900",
            avatarBg: "#0284c7"
          },
          rose: {
            fullGrad: "from-rose-900 via-pink-700 to-amber-500",
            nebulaOuter: "from-rose-800 via-pink-700 to-amber-500",
            nebulaInner: "from-rose-950 to-pink-900",
            avatarBg: "#e11d48"
          }
        };
        const theme = themeMap[cfg.themePreset || "indigo"] || themeMap.indigo;
        const logo = document.getElementById("library-brand-logo");
        if (logo) logo.className = `w-7 h-7 rounded-full bg-gradient-to-tr ${theme.fullGrad} shadow-sm flex items-center justify-center transition`;
        const nebula = document.getElementById("library-floating-nebula");
        if (nebula) nebula.className = `absolute bottom-6 right-8 w-20 h-20 rounded-full bg-gradient-to-tr ${theme.nebulaOuter} opacity-90 shadow-2xl pointer-events-none flex items-center justify-center filter blur-xs transition`;
        const nebulaInner = document.getElementById("library-floating-nebula-inner");
        if (nebulaInner) nebulaInner.className = `w-14 h-14 rounded-full bg-gradient-to-tr ${theme.nebulaInner} border border-white/20 transition`;
        if (avatarBtn) avatarBtn.style.backgroundColor = theme.avatarBg;
      }

      toggleSidebar() {
        document.getElementById("lib-sidebar")?.classList.toggle("hidden");
      }

      setTab(tab) {
        this.activeTab = tab;
        const tabs = ["recent", "search", "library", "trash"];
        tabs.forEach(t => {
          const btn = document.getElementById(`nav-${t}`);
          if (!btn) return;
          if (t === tab) {
            btn.className = "w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-semibold bg-zinc-200/80 dark:bg-zinc-800 text-zinc-900 dark:text-white transition";
          } else {
            btn.className = "w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-medium text-zinc-600 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-800/60 transition";
          }
        });

        const titles = {
          recent: "최근 열어본 논문",
          search: "라이브러리 검색",
          library: "라이브러리 전체 논문",
          trash: "휴지통"
        };
        const titleEl = document.getElementById("main-view-title");
        if (titleEl) titleEl.textContent = titles[tab] || "논문 목록";

        this.renderTable();
      }

      setLayout(mode) {
        this.layoutMode = mode;
        const listBtn = document.getElementById("view-mode-list-btn");
        const gridBtn = document.getElementById("view-mode-grid-btn");
        if (mode === "list") {
          listBtn.className = "p-1 rounded-md bg-white dark:bg-zinc-700 text-zinc-900 dark:text-white shadow-xs";
          gridBtn.className = "p-1 rounded-md text-zinc-400 hover:text-zinc-700 dark:hover:text-zinc-200";
        } else {
          gridBtn.className = "p-1 rounded-md bg-white dark:bg-zinc-700 text-zinc-900 dark:text-white shadow-xs";
          listBtn.className = "p-1 rounded-md text-zinc-400 hover:text-zinc-700 dark:hover:text-zinc-200";
        }
        this.renderTable();
      }

      toggleSort() {
        const modes = ["recent", "title", "rating"];
        const cur = modes.indexOf(this.sortMode);
        this.sortMode = modes[(cur + 1) % modes.length];
        this.renderTable();
      }

      sortBy(col) {
        if (col === "rating") this.sortMode = "rating";
        else if (col === "title") this.sortMode = "title";
        this.renderTable();
      }

      onSearch(val) {
        this.searchQuery = (val || "").trim().toLowerCase();
        this.renderTable();
      }

      promptCreateFolder() {
        const name = prompt("새 폴더 이름을 입력하세요:");
        if (!name || !name.trim()) return;
        this.folders.push({
          id: "folder-" + Date.now(),
          name: name.trim(),
          paperIds: []
        });
        localStorage.setItem("moonlight_library_folders", JSON.stringify(this.folders));
        this.renderFolders();
      }

      renderFolders() {
        const tree = document.getElementById("sidebar-folder-tree");
        if (!tree) return;
        if (this.folders.length === 0) {
          tree.innerHTML = `<div class="py-1 text-[11px] text-zinc-400 dark:text-zinc-500 italic">생성된 폴더가 없습니다</div>`;
          return;
        }
        tree.innerHTML = this.folders.map(f => `
          <div class="flex items-center justify-between py-1 px-2 rounded hover:bg-zinc-100 dark:hover:bg-zinc-800/60 cursor-pointer">
            <span class="truncate">📁 ${f.name}</span>
            <span class="text-[10px] text-zinc-400">${(f.paperIds || []).length}</span>
          </div>
        `).join("");
      }

      setRating(paperId, rating) {
        this.ratings[paperId] = rating;
        localStorage.setItem("moonlight_paper_ratings", JSON.stringify(this.ratings));
        this.renderTable();
      }

      async handleUpload(event) {
        const file = event.target?.files?.[0];
        if (!file) return;
        const arrayBuffer = await file.arrayBuffer();
        const paperId = "paper-uploaded-" + Date.now();
        const paperObj = {
          id: paperId,
          title: file.name.replace(/\.pdf$/i, ""),
          authors: "사용자 업로드 문서",
          year: new Date().getFullYear(),
          citations: [],
          keywords: ["업로드", "PDF"],
          pdfUrl: "",
          isUploaded: true,
          uploadedAt: Date.now()
        };

        if (window.researchDB) {
          await window.researchDB.saveUploadedPdf(paperId, file.name, arrayBuffer, paperObj);
        }
        await this.loadPapers();
        this.renderTable();
        event.target.value = "";
      }

      openPaper(paperId) {
        window.location.href = `index.html?paper=${encodeURIComponent(paperId)}`;
      }

      renderTable() {
        const tbody = document.getElementById("library-table-rows");
        const countLabel = document.getElementById("item-count-label");
        if (!tbody) return;

        let list = [...this.papers];

        if (this.searchQuery) {
          list = list.filter(p => (p.title || "").toLowerCase().includes(this.searchQuery));
        }

        if (this.sortMode === "rating") {
          list.sort((a, b) => (this.ratings[b.id] || 0) - (this.ratings[a.id] || 0));
        } else if (this.sortMode === "title") {
          list.sort((a, b) => (a.title || "").localeCompare(b.title || ""));
        } else {
          list.sort((a, b) => (b.uploadedAt || 0) - (a.uploadedAt || 0));
        }

        if (countLabel) countLabel.textContent = `${list.length}개의 논문`;

        if (list.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="6" class="py-16 text-center text-zinc-400 dark:text-zinc-600">
                <div class="w-12 h-12 mx-auto rounded-full bg-zinc-100 dark:bg-zinc-800 flex items-center justify-center mb-2 text-zinc-400">
                  <svg class="w-6 h-6 stroke-current fill-none stroke-2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                </div>
                <div class="text-sm font-semibold text-zinc-600 dark:text-zinc-300">라이브러리가 비어 있습니다</div>
                <div class="text-xs text-zinc-400 mt-1">상단의 [논문 업로드] 버튼을 눌러 PDF 논문을 추가해보세요.</div>
              </td>
            </tr>
          `;
          return;
        }

        tbody.innerHTML = list.map(p => {
          const rating = this.ratings[p.id] || 0;
          const starsHtml = [1, 2, 3, 4, 5].map(star => `
            <span onclick="libApp.setRating('${p.id}', ${star})"
                  class="cursor-pointer text-sm ${star <= rating ? 'text-amber-400' : 'text-zinc-200 dark:text-zinc-700 hover:text-amber-300'}">★</span>
          `).join("");

          return `
            <tr class="hover:bg-zinc-50/80 dark:hover:bg-zinc-800/40 group transition select-text">
              <td class="py-3 px-3">
                <input type="checkbox" class="rounded border-zinc-300 text-indigo-600 focus:ring-0 cursor-pointer" />
              </td>
              <td class="py-3 px-3 min-w-[320px]">
                <div class="cursor-pointer font-semibold text-zinc-800 dark:text-zinc-100 hover:text-indigo-600 dark:hover:text-indigo-400 transition" onclick="libApp.openPaper('${p.id}')">
                  ${p.title}
                </div>
                <div class="text-[11px] text-zinc-400 truncate max-w-md">${p.authors || ""} ${p.year ? `(${p.year})` : ""}</div>
              </td>
              <td class="py-3 px-3">
                <div class="flex items-center gap-0.5">${starsHtml}</div>
              </td>
              <td class="py-3 px-3 text-zinc-400">-</td>
              <td class="py-3 px-3">
                <span class="px-2 py-0.5 rounded-full text-[10px] font-medium bg-zinc-100 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-400">PDF</span>
              </td>
              <td class="py-3 px-3 text-right text-zinc-400 text-[11px]">방금 전</td>
            </tr>
          `;
        }).join("");
      }

      toggleCheckAll(checked) {
        document.querySelectorAll("#library-table-rows input[type='checkbox']").forEach(cb => {
          cb.checked = checked;
        });
      }
    }

    window.libApp = new MoonlightLibraryApp();
    const libApp = window.libApp;
  </script>
</body>
</html>
